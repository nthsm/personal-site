<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nthsm</title>

    <link rel="icon" type="image/svg+xml" href="images/dot.svg">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
    </div>

    <section class="hero">
        <h1>Nathan Smith</h1>
        <h2>Data Engineer</h2>
        
        <div class="links">
            <a href="https://github.com/nthsm" target="_blank" aria-label="GitHub">
                <i class="fab fa-github"></i>
            </a>
            <a href="https://linkedin.com/in/nthsm" target="_blank" aria-label="LinkedIn">
                <i class="fab fa-linkedin"></i>
            </a>
            <a href="mailto:nathan@nthsm.com" aria-label="Email">
                <i class="fas fa-envelope"></i>
            </a>
            <a href="nathan_smith_resume.pdf" download="Nathan Smith Resume" aria-label="Resume">
                <i class="fas fa-file-alt"></i>
        </div>
    </section>

    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('loader');
            setTimeout(() => {
                loader.style.opacity = '0';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }, 800);
        });
    </script>
</body>
</html>
